<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registra pesata</title><style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7f1;color:#243322}
.app{max-width:430px;margin:auto;min-height:100vh;padding:20px 18px;box-sizing:border-box}
.back{color:#52683a;text-decoration:none;font-weight:700;display:inline-block;margin-bottom:24px}
.head{text-align:center}.icon{font-size:40px}.head h1{font-size:27px;margin:6px 0}.head p{color:#697365;margin:0 0 24px}
.card,.client,.delivery,.stat{background:white;border-radius:18px;box-shadow:0 3px 14px #0000000c}
.btn{width:100%;padding:17px;border:0;border-radius:15px;background:#667d3f;color:white;font-size:18px;font-weight:800;margin:9px 0}
input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #d8ded3;border-radius:12px;font-size:17px;background:white}

</style>
